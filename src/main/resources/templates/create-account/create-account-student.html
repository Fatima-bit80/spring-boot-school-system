<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Student Account</title>
</head>
<body>

<form th:action="@{/createStudent}" method="post" th:object="${studentDTO}">


    <input type="text"  th:field="*{student.firstName}" placeholder="First Name">
    <input type="text"  th:field="*{student.lastName}" placeholder="Last Name">
    <input type="email"  th:field="*{member.email}" placeholder="Email">
    <input type="hidden" th:field="*{member.active}">
    <input type="password" name="password" th:field="*{member.password}" placeholder="Password" >
    <input type="number" name="year" th:field="*{student.year}" placeholder="Year">
    <input type="text" th:field="*{member.role}" readonly >
    <input type="submit" value="Create Student">
</form>

</body>
</html>
